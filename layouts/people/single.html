{{ define "main" }}

<article class="max-w-prose">
  <header class="mt-5">
    <h1 class="mt-0 text-4xl font-extrabold text-neutral-900 dark:text-neutral">
      {{ .Title | emojify }}
    </h1>

    {{ with .Params.role }}
      <p class="mt-1 text-lg text-neutral-600 dark:text-neutral-300">{{ . }}</p>
    {{ end }}
  </header>

  <div class="person-profile-layout">
    {{ with resources.Get .Params.photo }}
      <img
        class="person-profile-photo rounded-lg ring-2 ring-primary-500"
        src="{{ .RelPermalink }}"
        data-zoom-src="{{ .RelPermalink }}"
        alt="{{ $.Title }}">
    {{ end }}

    <section class="article-content person-profile-content prose dark:prose-invert">
      {{ .Content }}
    </section>
  </div>

  {{ with .Params.email }}
    <p class="mt-4">
      <a class="text-primary-700 hover:underline dark:text-primary-400" href="mailto:{{ . }}">{{ . }}</a>
    </p>
  {{ end }}
</article>

{{ end }}
